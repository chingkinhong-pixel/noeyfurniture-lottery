<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 诺一家具 NOEY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .serif-font { font-family: 'Noto Serif SC', serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans relative" style="background-image: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-position: center;">
    
    <div class="absolute inset-0 bg-black/40"></div>

    <div onclick="toggleForm()" class="absolute bottom-4 right-4 text-[10px] text-white/20 hover:text-white/80 cursor-pointer transition-colors z-50 tracking-widest">
        Admin.
    </div>

    <div class="glass-panel p-10 rounded-2xl shadow-2xl w-full max-w-md relative z-20 mx-4 transform transition-all">
        <div class="text-center mb-10">
            <img id="loginLogo" src="" alt="NOEY" class="h-8 mx-auto mb-6 object-contain hidden">
            <h1 id="pageTitle" class="text-2xl font-bold text-[#1A1A1A] tracking-wider serif-font">加载中...</h1>
            <p id="pageSubtitle" class="text-[#8C6A4F] mt-3 text-sm tracking-widest">...</p>
        </div>

        <div id="userForm">
            <div class="relative mb-6">
                <!-- 【修改】加入 maxlength 限制并绑定实时的键盘检测器 -->
                <input type="text" id="userPhone" maxlength="11" oninput="validatePhoneRealTime(this, 'userPhoneErr')" placeholder="请输入您的手机号" class="w-full px-4 py-4 bg-white/50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#8C6A4F] focus:border-transparent transition-all placeholder-gray-400 text-gray-900 font-mono text-lg tracking-wider">
                <!-- 【新增】实时错误信息提示块 -->
                <p id="userPhoneErr" class="text-xs text-red-500 mt-2 hidden tracking-widest pl-1"></p>
            </div>
            <button onclick="login(false)" class="w-full bg-[#1A1A1A] text-white py-4 rounded-lg hover:bg-[#8C6A4F] transition-colors duration-300 font-medium tracking-widest text-sm uppercase">
                立即开启专属礼遇
            </button>
        </div>

        <div id="adminForm" class="hidden">
            <div class="text-xs text-center text-gray-500 mb-6 tracking-widest uppercase">System Management</div>
            <div class="relative mb-4">
                <input type="text" id="adminPhone" maxlength="11" oninput="validatePhoneRealTime(this, 'adminPhoneErr')" placeholder="管理员账号" class="w-full px-4 py-3 bg-white/50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black transition-all font-mono tracking-wider">
                <p id="adminPhoneErr" class="text-xs text-red-500 mt-1 hidden tracking-widest pl-1"></p>
            </div>
            <input type="password" id="adminPwd" placeholder="管理密码" class="w-full px-4 py-3 bg-white/50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black mb-8 transition-all">
            <button onclick="login(true)" class="w-full bg-[#1A1A1A] text-white py-4 rounded-lg hover:bg-black transition-colors duration-300 font-medium tracking-widest text-sm uppercase shadow-lg">
                进入中枢
            </button>
        </div>
    </div>

    <script>
        let isAdminView = false;
        
        const urlParams = new URLSearchParams(window.location.search);
        const inviteCode = urlParams.get('invite');
        if(inviteCode) {
            fetch('/api/invite/click', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ invite: inviteCode })
            });
        }

        fetch('/api/config').then(res => res.json()).then(data => {
            document.getElementById('pageTitle').innerText = data.title || 'NOEY 诺一家具';
            document.getElementById('pageSubtitle').innerText = data.subtitle || '为每一位客户准备专属定制礼物';
            document.title = (data.title || 'NOEY') + " - 品牌认证";
            
            const MY_LOGO_COLOR = 'https://cdn.phototourl.com/free/2026-07-22-3304ec9f-26ef-4847-b0b1-f9287f713966.png';
            const logoEl = document.getElementById('loginLogo');
            logoEl.src = data.logoColorUrl || MY_LOGO_COLOR;
            logoEl.classList.remove('hidden');
        });

        function toggleForm() {
            isAdminView = !isAdminView;
            document.getElementById('userForm').classList.toggle('hidden');
            document.getElementById('adminForm').classList.toggle('hidden');
        }

        // 【新增】实时手机号码过滤与校验逻辑
        function validatePhoneRealTime(inputElement, errorElementId) {
            // 1. 强制过滤非数字，防止粘贴了字母或特殊符号
            let val = inputElement.value.replace(/\D/g, ''); 
            inputElement.value = val;
            
            const errEl = document.getElementById(errorElementId);
            const regex = /^1[3-9]\d{9}$/;

            if (val.length === 0) {
                errEl.classList.add('hidden');
            } else if (val.length === 11) {
                // 如果凑齐了 11 位，检测是否为合法真实号段
                if (!regex.test(val)) {
                    errEl.classList.remove('hidden');
                    errEl.innerText = "请输入正确的11位手机号码";
                } else {
                    errEl.classList.add('hidden'); // 正确则隐藏红字
                }
            } else {
                // 如果没凑齐11位，但是第一位输错，立刻拦截
                if (val[0] !== '1') {
                    errEl.classList.remove('hidden');
                    errEl.innerText = "手机号必须以1开头";
                } else {
                    errEl.classList.add('hidden');
                }
            }
        }

        async function login(isAdminLogin) {
            const phone = isAdminLogin ? document.getElementById('adminPhone').value : document.getElementById('userPhone').value;
            const password = isAdminLogin ? document.getElementById('adminPwd').value : "";
            
            if (!phone) return alert('请输入手机号');

            // 【修改】前端提交阶段的终极验证，防止错误数据发往后端
            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                alert("请输入有效手机号参与活动");
                return;
            }

            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "验证中...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password, isAdminLogin, invite: inviteCode })
                });
                const data = await res.json();

                if (data.error) throw new Error(data.error);

                localStorage.setItem('token', data.token);
                window.location.href = data.role === 'admin' ? '/admin.html' : '/index.html';
            } catch (err) {
                alert(err.message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
