<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEY - 客户跟进 CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #F9F9F9; font-family: -apple-system, sans-serif; color: #1A1A1A; }
        .nav-link { color: #71717A; padding-bottom: 12px; font-size: 14px; letter-spacing: 0.1em; transition: all 0.3s; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px; }
        .nav-link:hover { color: #1A1A1A; }
        .nav-link.active { color: #1A1A1A; font-weight: 600; border-bottom: 2px solid #1A1A1A; }
        .table-header { font-size: 11px; font-weight: 700; color: #71717A; border-bottom: 1px solid #EEEEEE; padding: 16px; background-color: #FAFAFA; text-align: left; white-space: nowrap;}
        .table-cell { font-size: 13px; padding: 16px; border-bottom: 1px solid #FAFAFA; vertical-align: top;}
        .table-row { transition: background-color 0.2s; background: white;}
        .table-row:hover { background-color: #FAFAFA; }
        
        .tag-新客户 { background: #F4F4F5; color: #52525B; border: 1px solid #E4E4E7; }
        .tag-未联系 { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
        .tag-已咨询 { background: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }
        .tag-已量房 { background: #E0F2FE; color: #0369A1; border: 1px solid #BAE6FD; }
        .tag-已报价 { background: #F3E8FF; color: #6B21A8; border: 1px solid #E9D5FF; }
        .tag-已成交 { background: #DCFCE7; color: #166534; border: 1px solid #BBF7D0; }
        .tag-已完成安装 { background: #D1FAE5; color: #14532D; border: 1px solid #86EFAC; }
        .tag-暂无需求 { background: #F3F4F6; color: #4B5563; border: 1px solid #D1D5DB; }
    </style>
</head>
<body class="min-h-screen pb-12">
    
    <header class="bg-white border-b border-[#EEEEEE] sticky top-0 z-50 shadow-sm">
        <div class="max-w-[1400px] mx-auto px-6 pt-6 flex justify-between items-end">
            <div>
                <h1 class="text-xl font-bold tracking-widest mb-6 flex items-center gap-2">
                    <i class="ph-fill ph-users text-[#8C6A4F]"></i> NOEY CRM
                </h1>
                <nav class="flex space-x-8">
                    <a href="admin.html" class="nav-link"><i class="ph ph-chart-pie-slice text-lg"></i> 营销数据驾驶舱</a>
                    <a href="settings.html" class="nav-link"><i class="ph ph-faders text-lg"></i> 基础设置与资产</a>
                    <a href="customer-management.html" class="nav-link active"><i class="ph ph-users text-lg"></i> 客户跟进 CRM</a>
                    <a href="reward-records.html" class="nav-link"><i class="ph ph-gift text-lg"></i> 中奖流水库</a>
                    <a href="share-management.html" class="nav-link"><i class="ph ph-share-network text-lg"></i> 分享裂变管理</a>
                </nav>
            </div>
            <button onclick="logout()" class="mb-6 text-xs text-gray-500 hover:text-black tracking-widest uppercase transition flex items-center gap-1">
                <i class="ph ph-sign-out"></i> 退出
            </button>
        </div>
    </header>

    <div class="max-w-[1400px] mx-auto px-6 py-8">
        <div class="bg-white border border-[#EEEEEE] rounded-lg shadow-sm overflow-hidden">
            
            <div class="flex justify-between items-center p-6 border-b border-gray-100">
                <div class="flex items-center gap-4">
                    <h2 class="text-base font-bold text-gray-800 flex items-center gap-2">客户线索流转系统</h2>
                    <div class="relative ml-4">
                        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="搜索姓名或手机号..." class="pl-9 pr-4 py-2 text-xs border border-gray-200 rounded bg-gray-50 focus:bg-white focus:outline-none focus:border-black transition w-64">
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportToExcel()" class="text-xs text-white bg-green-700 hover:bg-green-800 px-4 py-2 rounded transition shadow-sm flex items-center gap-1">
                        <i class="ph ph-microsoft-excel-logo text-base"></i> 导出 Excel
                    </button>
                    <button onclick="loadCustomers()" class="text-xs text-gray-600 bg-white hover:bg-gray-50 border border-gray-200 px-4 py-2 rounded transition shadow-sm flex items-center gap-1">
                        <i class="ph ph-arrows-clockwise text-base"></i> 刷新
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto min-h-[500px]">
                <table class="w-full text-left border-collapse min-w-[1200px]">
                    <thead>
                        <tr>
                            <th class="table-header w-40">客户档案</th>
                            <th class="table-header w-24">线索来源</th>
                            <th class="table-header w-48">定制需求意向</th>
                            <th class="table-header w-32">客户类型标签</th>
                            <th class="table-header w-36">跟进成交漏斗</th>
                            <th class="table-header">销售跟进记录 (实时保存)</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody"></tbody>
                </table>
            </div>

            <div class="p-4 border-t border-gray-100 bg-gray-50 flex justify-between items-center text-sm">
                <div class="text-[11px] text-gray-500" id="pageInfo"></div>
                <div class="flex gap-2" id="paginationControls"></div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';
        const headers = { 'Authorization': token, 'Content-Type': 'application/json' };
        
        const statusOptions = ['新客户', '未联系', '已咨询', '已量房', '已报价', '已成交', '已完成安装', '暂无需求'];
        const tagOptions = ['普通客户', '潜在客户', '高意向客户', '成交客户', '老客户推荐'];

        let allCustomers = []; let searchQuery = ""; let currentPage = 1; const pageSize = 15;

        async function loadCustomers() {
            document.getElementById('customerTableBody').innerHTML = `<tr><td colspan="6" class="text-center py-16 text-gray-400 text-sm">加载中...</td></tr>`;
            try {
                const res = await fetch('/api/admin/customers', { headers }); if (res.status === 403) return logout();
                allCustomers = await res.json(); renderCustomers();
            } catch(e) { console.error(e); }
        }

        function handleSearch(query) { searchQuery = query.trim().toLowerCase(); currentPage = 1; renderCustomers(); }

        function renderCustomers() {
            let filtered = allCustomers;
            if (searchQuery) filtered = filtered.filter(c => (c.name && c.name.toLowerCase().includes(searchQuery)) || (c.phone && c.phone.includes(searchQuery)));

            const total = filtered.length; const totalPages = Math.ceil(total / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * pageSize; const paginated = filtered.slice(start, start + pageSize);

            const tbody = document.getElementById('customerTableBody');
            if(paginated.length === 0) {
                 tbody.innerHTML = `<tr><td colspan="6" class="text-center py-16 text-gray-400 text-sm">无匹配记录</td></tr>`;
            } else {
                tbody.innerHTML = paginated.map(c => `
                    <tr class="table-row">
                        <td class="table-cell">
                            <div class="font-bold text-gray-800 text-sm mb-1">${c.name}</div>
                            <div class="text-[11px] text-[#8C6A4F] font-mono mb-1">${c.phone}</div>
                            <div class="text-[10px] text-gray-400">${c.registerTime.split(' ')[0]}</div>
                        </td>
                        <td class="table-cell"><span class="text-[10px] text-gray-500 bg-gray-100 px-2 py-1 rounded border border-gray-200">${c.source}</span></td>
                        <td class="table-cell">
                            <div class="flex flex-col gap-1.5 text-[11px]">
                                <span class="text-gray-600"><span class="text-gray-400 w-8 inline-block">阶段:</span> ${c.stage}</span>
                                <span class="text-[#8C6A4F] font-bold"><span class="text-gray-400 w-8 inline-block font-normal">预算:</span> ${c.budget}</span>
                                <span class="text-gray-600"><span class="text-gray-400 w-8 inline-block">户型:</span> ${c.layout}</span>
                            </div>
                        </td>
                        <td class="table-cell">
                            <select onchange="updateTag('${c.phone}', this.value)" class="text-[11px] border border-gray-200 rounded p-1.5 focus:outline-none focus:border-black bg-white transition w-full">
                                <option value="">+ 添加分类标签</option>
                                ${tagOptions.map(opt => `<option value="${opt}" ${(c.tags && c.tags.includes(opt)) ? 'selected' : ''}>${opt}</option>`).join('')}
                            </select>
                        </td>
                        <td class="table-cell">
                            <select onchange="updateCustomer('${c.phone}', 'followUpStatus', this.value)" class="text-xs font-bold rounded px-2 py-1.5 focus:outline-none cursor-pointer tag-${c.followUpStatus || '新客户'} w-full text-center">
                                ${statusOptions.map(opt => `<option value="${opt}" ${c.followUpStatus === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                            </select>
                        </td>
                        <td class="table-cell">
                            <textarea onblur="updateCustomer('${c.phone}', 'remark', this.value)" class="w-full text-xs border border-gray-200 rounded p-2 h-16 resize-none focus:outline-none focus:border-[#8C6A4F] bg-gray-50 focus:bg-white transition leading-relaxed" placeholder="如: 7-22: 客户喜欢极简，已邀约到店看方案">${c.remark}</textarea>
                        </td>
                    </tr>`).join('');
            }

            document.getElementById('pageInfo').innerText = `共 ${total} 人，第 ${currentPage} / ${totalPages} 页`;
            document.getElementById('paginationControls').innerHTML = `
                <button onclick="currentPage--; renderCustomers()" ${currentPage === 1 ? 'disabled' : ''} class="px-2 py-1 bg-white border border-gray-200 rounded text-xs hover:bg-gray-50 disabled:opacity-50 transition">上一页</button>
                <button onclick="currentPage++; renderCustomers()" ${currentPage === totalPages ? 'disabled' : ''} class="px-2 py-1 bg-white border border-gray-200 rounded text-xs hover:bg-gray-50 disabled:opacity-50 transition">下一页</button>`;
        }

        async function updateCustomer(phone, field, value) {
            const body = {}; body[field] = value;
            try {
                await fetch(`/api/admin/customers/${phone}`, { method: 'PUT', headers, body: JSON.stringify(body) });
                const idx = allCustomers.findIndex(c => c.phone === phone); if(idx > -1) allCustomers[idx][field] = value;
                if(field === 'followUpStatus') renderCustomers(); 
            } catch(e) { alert('更新失败'); }
        }

        async function updateTag(phone, tag) {
            if(!tag) return;
            const body = { tags: [tag] }; // 简易单选覆盖逻辑
            try {
                await fetch(`/api/admin/customers/${phone}`, { method: 'PUT', headers, body: JSON.stringify(body) });
                const idx = allCustomers.findIndex(c => c.phone === phone); if(idx > -1) allCustomers[idx].tags = [tag];
            } catch(e) { alert('贴标签失败'); }
        }

        // 导出 Excel 功能
        function exportToExcel() {
            if(allCustomers.length === 0) return alert('没有可导出的数据');
            const dataToExport = allCustomers.map(c => ({
                "客户姓名": c.name, "联系电话": c.phone, "注册时间": c.registerTime, "线索来源": c.source,
                "装修阶段": c.stage, "意向预算": c.budget, "房屋户型": c.layout, "意向需求": c.needType,
                "客户标签": c.tags ? c.tags.join('、') : '', "跟进状态": c.followUpStatus || '新客户', "最新销售备注": c.remark
            }));
            const ws = XLSX.utils.json_to_sheet(dataToExport);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "客户线索表");
            XLSX.writeFile(wb, `NOEY_CRM客户导出_${new Date().toLocaleDateString().replace(/\//g,'-')}.xlsx`);
        }

        function logout() { localStorage.removeItem('token'); window.location.href = '/login.html'; }
        loadCustomers();
    </script>
</body>
</html>
